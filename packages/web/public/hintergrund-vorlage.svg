<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <title>Vorlage für Buchungsseiten-Hintergrund</title>
  <desc>1200 × 800. Der mittlere Bereich von 770 × 420 bleibt frei, dort liegt die Buchungskarte. Alle Hilfslinien vor dem Export entfernen.</desc>

  <rect width="1200" height="800" fill="#faf9f7"/>

  <!-- Randzone: hier nichts Wichtiges platzieren, je nach Fensterformat wird beschnitten -->
  <rect x="0" y="0" width="1200" height="60" fill="#f0ede8"/>
  <rect x="0" y="740" width="1200" height="60" fill="#f0ede8"/>
  <rect x="0" y="60" width="60" height="680" fill="#f0ede8"/>
  <rect x="1140" y="60" width="60" height="680" fill="#f0ede8"/>
  <text x="600" y="38" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" fill="#8a8378">
    Randzone — hier nichts Wichtiges, wird je nach Fensterformat angeschnitten
  </text>

  <!-- Freizuhaltender Bereich: die Buchungskarte -->
  <rect x="215" y="190" width="770" height="420" rx="12"
        fill="#ffffff" fill-opacity="0.55" stroke="#9f1239" stroke-width="3" stroke-dasharray="14 10"/>
  <text x="600" y="386" text-anchor="middle" font-family="system-ui, sans-serif" font-size="30" font-weight="600" fill="#9f1239">
    Freihalten — hier liegt die Buchungskarte
  </text>
  <text x="600" y="422" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" fill="#9f1239">
    770 × 420, mittig (64 % Breite, 53 % Höhe)
  </text>

  <!-- Nutzbare Fläche links und rechts -->
  <text x="137" y="400" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" fill="#6b6459">nutzbar</text>
  <text x="1063" y="400" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" fill="#6b6459">nutzbar</text>

  <!-- Mittelachsen als Setzhilfe -->
  <line x1="600" y1="0" x2="600" y2="800" stroke="#d6d1c8" stroke-width="1" stroke-dasharray="6 8"/>
  <line x1="0" y1="400" x2="1200" y2="400" stroke="#d6d1c8" stroke-width="1" stroke-dasharray="6 8"/>
</svg>
