server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Bei Verzeichnissen (/en -> /en/) baut nginx sonst eine absolute URL aus dem
    # eigenen Schema und Port: http://mein-kalender.link/en/ — hinter dem Ingress
    # faellt die Verbindung damit auf http zurueck. Relative Location statt absoluter.
    absolute_redirect off;
    port_in_redirect off;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
